changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: 🚀 Features
      labels:
        - feat
    - title: 🐛 Bug Fixes
      labels:
        - fix
    - title: ♻️ Refactors
      labels:
        - refactor
    - title: 🧰 Maintenance
      labels:
        - chore
    - title: 📝 Documentation
      labels:
        - docs
    - title: ⬆️ Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
