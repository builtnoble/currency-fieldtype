name: Bug Report
description: Report a problem with the Currency fieldtype
labels: ["fix"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: statamic-version
    attributes:
      label: Statamic version
      placeholder: "6.x"
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Currency Fieldtype version
      placeholder: "x.y.z"
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.3"
    validations:
      required: true
