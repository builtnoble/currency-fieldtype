version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [chore, dependencies]
    commit-message:
      prefix: "chore"
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [chore, dependencies]
    commit-message:
      prefix: "chore"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [chore, dependencies]
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
